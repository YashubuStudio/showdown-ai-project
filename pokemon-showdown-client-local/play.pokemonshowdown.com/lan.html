	<link rel="shortcut icon" href="favicon.ico" id="dynamic-favicon" />

	<!--[if lte IE 8]><script>
		window.Config = {"oldie": true};
	</script><![endif]-->
	<script>
		(function () {
			const params = new URLSearchParams(window.location.search);
			let host = window.location.hostname;
			let port = 8000;
			let protocol = params.get('protocol') === 'https' ? 'https' : 'http';
			let serverid = params.get('serverid') || 'koharulocal';

			const shorthand = /\?~~(([^:\/?&]+)(:[0-9]+)?)/.exec(window.location.search);
			if (shorthand) {
				host = shorthand[2] || host;
				if (shorthand[3]) port = Number(shorthand[3].slice(1)) || port;
			}

			if (params.get('host')) host = params.get('host') || host;
			if (params.get('port')) port = Number(params.get('port')) || port;
			if (params.get('serverid')) serverid = params.get('serverid') || serverid;

			window.SHOWDOWN_SUITE_LOCAL_CONFIG = {
				enabled: true,
				debugNetLog: false,
				usernameKey: `showdown_suite_local_username:${serverid}`,
				server: {
					id: serverid,
					host,
					port,
					httpport: port,
					altport: 80,
					prefix: '/showdown',
					protocol,
					registered: false,
				},
			};
		})();
	</script>
</head><body>
	<div id="ps-frame">
		<div id="header" class="header">
			<div class="maintabbarbottom"></div>
			<img class="logo" src="favicon-256.png" alt="Pokémon Showdown LAN" width="50" height="50">
		</div>
		<div class="ps-room scrollable" id="room-">
			<div class="mainmenu-mini-windows">
				<div class="mini-window" data-roomid="news">
					<h3 class="mini-window-header"><button class="closebutton" tabindex="-1" aria-label="Close"><i class="fa fa-times-circle"></i></button>LAN</h3>
					<div id="room-news" class="mini-window-contents ps-room-light scrollable" style="height: auto;" data-newsid="0">
						<div class="readable-bg">
							ローカル LAN 専用クライアントです。名前と接続先はこのネットワーク内だけで扱います。
						</div>
					</div>
				</div>
			</div>
			<div class="mainmenu">
				<div id="loading-message" class="mainmessage">Loading... <noscript>FAILED<br /><br />Pok&eacute;mon Showdown requires JavaScript.</noscript></div>
			</div>
			<div class="mainmenufooter">
				<small>Local LAN client for Showdown Suite</small>
			</div>
		</div>
	</div>

		function linkStyle(url) {
			var linkEl = document.createElement('link');

		}

	<script>
		(function () {
			const local = window.SHOWDOWN_SUITE_LOCAL_CONFIG;
			if (!window.Config || !local) return;
			const host = window.location.host;
			Config.testclient = false;
			Config.routes.root = host;
			Config.routes.client = host + '/play.pokemonshowdown.com';
			Config.routes.dex = host;
			Config.routes.replays = host;
			Config.routes.users = host;
			Config.routes.teams = host;
			Config.defaultserver = {...local.server};
			Config.server = {...local.server};
		})();
	</script>
